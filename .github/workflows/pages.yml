# Build a page per design in examples/designs/ (each runs printshop in the browser) and publish them
# to GitHub Pages. One-time setup: Settings -> Pages -> Source: GitHub Actions.
name: pages

on:
  push:
    branches: [main, printshop-roadmap]
    paths: ["printshop/**", "examples/designs/**", "tools/pyodide/dist/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: printshop site site examples/designs/*.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
