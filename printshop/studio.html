<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>printshop studio</title>
<style>
  :root {
    --bg: #f4f3ef; --panel: #ffffffee; --ink: #1d1d1f; --muted: #6b6b70; --line: #dddad2;
    --accent: #2f6fff; --good: #2e8b57; --bad: #c8323a; --stage: #eceae4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #17181b; --panel: #222429ee; --ink: #ececef; --muted: #9a9aa3; --line: #34363c;
      --accent: #6f9bff; --good: #5cc28a; --bad: #ff6b6b; --stage: #1d1f23;
    }
  }
  :root[data-theme="dark"] {
    --bg: #17181b; --panel: #222429ee; --ink: #ececef; --muted: #9a9aa3; --line: #34363c;
    --accent: #6f9bff; --good: #5cc28a; --bad: #ff6b6b; --stage: #1d1f23;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  #stage { position: fixed; inset: 0; background: var(--stage); }
  #panel { position: fixed; top: 12px; right: 12px; width: 300px; max-height: calc(100% - 24px); overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    backdrop-filter: blur(8px); }
  h1 { font-size: 15px; margin: 0 0 2px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 10px; }
  details { border-top: 1px solid var(--line); padding: 8px 0; }
  summary { cursor: pointer; font-weight: 600; list-style: none; display: flex; justify-content: space-between; }
  summary::-webkit-details-marker { display: none; }
  summary .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
  .row { margin: 8px 0; }
  .row label { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
  .row input[type=range] { width: 100%; accent-color: var(--accent); }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 6px 0 0; font-size: 13px; }
  dt { color: var(--muted); } dd { margin: 0; }
  .ok { color: var(--good); } .no { color: var(--bad); }
  select, button, a.btn { font: inherit; color: var(--ink); background: transparent; border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 10px; text-decoration: none; cursor: pointer; }
  .buttons { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  #error { position: fixed; left: 12px; bottom: 12px; right: 336px; max-height: 40%; overflow: auto; display: none;
    background: var(--panel); border: 1px solid var(--bad); border-radius: 12px; padding: 10px 12px;
    font: 12px/1.4 ui-monospace, monospace; white-space: pre-wrap; color: var(--bad); }
  .note { color: var(--muted); font-size: 12px; }
  textarea { width: 100%; min-height: 260px; margin-top: 8px; resize: vertical; color: var(--ink); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px; padding: 8px; font: 12px/1.45 ui-monospace, monospace; tab-size: 4; }
  #panel.wide { width: 420px; }
  @media (max-width: 640px) {
    #panel { top: auto; bottom: 0; right: 0; left: 0; width: auto; max-height: 45%; border-radius: 12px 12px 0 0; }
    #error { right: 12px; bottom: 47%; }
  }
</style>
<script type="importmap">
  { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
                 "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/" } }
</script>
</head>
<body>
<div id="stage"></div>
<aside id="panel">
  <h1 id="title">printshop studio</h1>
  <div class="sub" id="sub">drag to turn · scroll to zoom · double-click to frame</div>
  <details id="shape" open><summary>Shape <span class="hint" id="shape-hint"></span></summary><div id="params"></div></details>
  <details id="checks"><summary>Checks <span class="hint" id="checks-hint">…</span></summary><dl id="report"></dl></details>
  <details id="codebox" hidden><summary>Code <span class="hint">runs in this page</span></summary>
    <textarea id="source" spellcheck="false"></textarea>
    <div class="buttons"><button id="run">Run (Ctrl+Enter)</button></div></details>
  <details id="printer"><summary>Printer <span class="hint" id="printer-hint"></span></summary>
    <div class="row"><label>Profile: every fit comes from it</label><select id="profile"></select></div></details>
  <div class="buttons"><button id="stl">Download STL</button><a class="btn" id="mf" href="#">Download 3MF</a></div>
</aside>
<div id="error"></div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

const BOOT = /*BOOT*/null;
const $ = (id) => document.getElementById(id);
const stage = $("stage");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(devicePixelRatio);
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, 0.1, 5000);
camera.up.set(0, 0, 1);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
scene.add(new THREE.HemisphereLight(0xffffff, 0x8a8a90, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(-1, -2, 3);
scene.add(sun);
const grid = new THREE.GridHelper(256, 32, 0x9a9890, 0xc8c6be);
grid.rotation.x = Math.PI / 2;
grid.material.transparent = true;
grid.material.opacity = 0.35;
scene.add(grid);
const model = new THREE.Group();
scene.add(model);
let framed = false, meshes = [], values = {};

function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
addEventListener("resize", resize);
resize();
(function loop() { controls.update(); renderer.render(scene, camera); requestAnimationFrame(loop); })();

const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)).buffer;

function show(data) {
  $("error").style.display = data.error ? "block" : "none";
  if (data.error) { $("error").textContent = data.error; return; }  // keep the last good model on screen
  model.clear();
  meshes = data.parts.map((p) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(new Float32Array(bytes(p.positions)), 3));
    g.setIndex(new THREE.BufferAttribute(new Uint32Array(bytes(p.indices)), 1));
    const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color: p.colour, flatShading: true, roughness: 0.7 }));
    m.name = p.name;
    model.add(m);
    return m;
  });
  const c = data.checks;
  const ok = c.stands;  // several pieces is fine (wings, a rider); falling over is not
  $("checks-hint").innerHTML = `<span class="${ok ? "ok" : "no"}">${ok ? "✓" : "!"}</span> ${c.size_mm.join(" × ")} mm`;
  $("report").innerHTML = [
    ["pieces", c.pieces], ["stands up", c.stands ? `yes, ${c.stability_margin_mm} mm in` : "no", c.stands],
    ["size", c.size_mm.join(" × ") + " mm"], ["volume", c.volume_cm3 + " cm³"], ["parts", c.parts.join(", ")],
  ].map(([k, v, good]) => `<dt>${k}</dt><dd class="${good === undefined ? "" : good ? "ok" : "no"}">${v}</dd>`).join("");
  const size = new THREE.Box3().setFromObject(model).getSize(new THREE.Vector3()).length();
  if (!framed || size > 1.3 * lastSize || size < 0.6 * lastSize) frame();  // much bigger or smaller: look again
  lastSize = size;
}
let lastSize = 0;
renderer.domElement.addEventListener("dblclick", frame);

function frame() {
  const box = new THREE.Box3().setFromObject(model);
  if (box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3()).length(), mid = box.getCenter(new THREE.Vector3());
  controls.target.copy(mid);
  camera.position.copy(mid).add(new THREE.Vector3(-0.7, -1.2, 0.8).normalize().multiplyScalar(size * 1.6));
  framed = true;
}

function sliders(params) {
  const keys = Object.keys(params);
  $("shape").style.display = keys.length ? "" : "none";
  $("shape-hint").textContent = keys.length ? `${keys.length} setting${keys.length > 1 ? "s" : ""}` : "";
  $("params").innerHTML = "";
  for (const [k, spec] of Object.entries(params)) {
    if (spec.length < 3 || typeof spec[0] !== "number") continue;
    const [def, lo, hi, step = (hi - lo) / 100] = spec;
    if (!(k in values)) values[k] = def;
    const row = document.createElement("div");
    row.className = "row";
    row.innerHTML = `<label><span>${k.replaceAll("_", " ")}</span><output>${values[k]}</output></label>
      <input type="range" min="${lo}" max="${hi}" step="${step}" value="${values[k]}" ${interactive() ? "" : "disabled"}>`;
    const input = row.querySelector("input"), out = row.querySelector("output");
    input.addEventListener("input", () => { values[k] = +input.value; out.textContent = input.value; later(fetchModel); });
    $("params").appendChild(row);
  }
  if (!interactive() && keys.length) $("params").insertAdjacentHTML("beforeend", BOOT.engine === "pyodide"
    ? `<p class="note">Loading Python in this page; the sliders wake up when it is ready.</p>`
    : `<p class="note">A snapshot: run <code>printshop studio ${BOOT.title}</code> to move these.</p>`);
}

let timer;
const later = (f) => { clearTimeout(timer); timer = setTimeout(f, 150); };
const query = () => `params=${encodeURIComponent(JSON.stringify(values))}&profile=${$("profile").value}`;

let py = null;  // Pyodide, when the design runs in this page
const interactive = () => BOOT.live || py !== null;

async function fetchModel() {
  if (py) {
    py.globals.set("_params", JSON.stringify(values));
    py.globals.set("_profile", $("profile").value);
    show(JSON.parse(await py.runPythonAsync("json.dumps(studio.payload(DESIGN, _profile, json.loads(_params)))")));
    return;
  }
  show(await (await fetch(`/model?${query()}`)).json());
  $("mf").href = `/download.3mf?${query()}`;
}

function save(bytes, name) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([bytes], { type: "application/octet-stream" }));
  a.download = name;
  a.click();
}

async function bootPython() {  // the design runs here: Pyodide, numpy, Pillow, manifold3d, printshop
  const say = (t) => { $("sub").textContent = t; };
  say("loading Python…");
  await new Promise((ok, no) => { const s = document.createElement("script"); s.src = BOOT.pyodide + "pyodide.js";
    s.onload = ok; s.onerror = no; document.head.appendChild(s); });
  const p = await loadPyodide({ indexURL: BOOT.pyodide });
  say("loading numpy, Pillow and manifold…");
  await p.loadPackage(BOOT.wheels.map((w) => new URL(w, location.href).href));
  const zip = await (await fetch(BOOT.source_zip)).arrayBuffer();
  const site = p.runPython("import site; site.getsitepackages()[0]");
  p.unpackArchive(zip, "zip", { extractDir: site });
  p.FS.mkdirTree("/work");
  p.FS.writeFile("/work/design.py", BOOT.source);
  await p.runPythonAsync("import json\nfrom printshop import studio\nDESIGN = '/work/design.py'");
  py = p;
  say("running in this page · drag to turn · scroll to zoom");
  $("codebox").hidden = false;
  $("source").value = BOOT.source;
  $("profile").disabled = false;
  $("mf").style.display = "";
  sliders(BOOT.params);
  await fetchModel();
}

async function runSource() {  // the code box: save the design, re-read its sliders, run it
  py.FS.writeFile("/work/design.py", $("source").value);
  try {
    const params = JSON.parse(await py.runPythonAsync("json.dumps(studio.params_of(DESIGN))"));
    if (JSON.stringify(Object.keys(params)) !== JSON.stringify(Object.keys(BOOT.params))) { values = {}; }
    BOOT.params = params;
    sliders(params);
  } catch (e) { /* a syntax error: the run below shows it */ }
  await fetchModel();
}
$("run").addEventListener("click", runSource);
$("source").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); runSource(); }
  if (e.key === "Tab") { e.preventDefault(); document.execCommand("insertText", false, "    "); }
});
$("codebox").addEventListener("toggle", () => $("panel").classList.toggle("wide", $("codebox").open));
$("mf").addEventListener("click", async (e) => {
  if (!py) return;  // served live: the link downloads from the studio
  e.preventDefault();
  py.globals.set("_params", JSON.stringify(values));
  py.globals.set("_profile", $("profile").value);
  const bytes = await py.runPythonAsync("studio.downloads(DESIGN, _profile, json.loads(_params), '3mf')");
  save(bytes.toJs(), BOOT.title.replace(/\.py$/, ".3mf"));
});

$("stl").addEventListener("click", () => {  // binary STL of what is on screen, written here
  const tris = [];
  for (const m of meshes) {
    const p = m.geometry.attributes.position.array, ix = m.geometry.index.array;
    for (let i = 0; i < ix.length; i++) tris.push(p[3 * ix[i]], p[3 * ix[i] + 1], p[3 * ix[i] + 2]);
  }
  const n = tris.length / 9, buf = new DataView(new ArrayBuffer(84 + 50 * n));
  buf.setUint32(80, n, true);
  for (let t = 0; t < n; t++) for (let v = 0; v < 9; v++) buf.setFloat32(84 + 50 * t + 12 + 4 * v, tris[9 * t + v], true);
  save(buf.buffer, BOOT.title.replace(/\.py$/, ".stl"));
});

$("title").textContent = BOOT.title;
for (const p of BOOT.profiles) $("profile").insertAdjacentHTML("beforeend", `<option ${p === BOOT.profile ? "selected" : ""}>${p}</option>`);
$("printer-hint").textContent = BOOT.profile;
$("profile").disabled = !BOOT.live;
$("profile").addEventListener("change", () => { $("printer-hint").textContent = $("profile").value; fetchModel(); });
sliders(BOOT.params);
if (BOOT.live) {
  let seen = null;
  const poll = async () => {
    try {
      const v = await (await fetch("/version")).json();
      if (v.mtime !== seen) {
        if (JSON.stringify(Object.keys(v.params)) !== JSON.stringify(Object.keys(BOOT.params))) { BOOT.params = v.params; sliders(v.params); }
        seen = v.mtime;
        await fetchModel();
      }
    } catch (e) { /* the studio stopped; keep what is on screen */ }
    setTimeout(poll, 600);
  };
  poll();
} else {
  $("mf").style.display = "none";
  $("sub").textContent = "a snapshot · drag to turn · scroll to zoom";
  show(BOOT.model);
  if (BOOT.engine === "pyodide") bootPython().catch((e) => {
    $("sub").textContent = "Python did not load here: this is a snapshot";
    $("error").style.display = "block";
    $("error").textContent = String(e);
  });
}
</script>
</body>
</html>
